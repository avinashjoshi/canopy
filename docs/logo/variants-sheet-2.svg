<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 400" width="1360" height="400"><rect width="1360" height="400" fill="#0b0e13"/><g transform="translate(40,40)">
  <defs>
    <linearGradient id="lg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#6ee7a7"/>
