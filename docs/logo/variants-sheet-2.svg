    <circle cx="118" cy="110" r="8"/><circle cx="160" cy="78" r="8"/>
  </g>
  <!-- stem -->
  <path d="M62 194 L40 216" stroke="#9aa5b1" stroke-width="12" stroke-linecap="round"/>
</g><text x="168" y="340" text-anchor="middle" font-family="JetBrainsMono NF, JetBrains Mono, monospace" font-size="22" fill="#e6edf3">E · leaf</text><text x="168" y="368" text-anchor="middle" font-family="JetBrainsMono NF, JetBrains Mono, monospace" font-size="14" fill="#8b95a5">veins are a git graph</text><g transform="translate(360,40)">
  <rect width="256" height="256" rx="56" fill="#0f1419"/>
  <g fill="none" stroke-linecap="round">
    <path d="M44 150 A84 84 0 0 1 212 150" stroke="#6ee7a7" stroke-width="18"/>
    <path d="M78 150 A50 50 0 0 1 178 150" stroke="#2fc48f" stroke-width="18"/>
    <path d="M112 150 A16 16 0 0 1 144 150" stroke="#14b8a6" stroke-width="18"/>
  </g>
  <path d="M128 236 V158" stroke="#9aa5b1" stroke-width="14" stroke-linecap="round"/>
  <path d="M128 206 C128 186 100 186 100 170" stroke="#9aa5b1" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="100" cy="168" r="7" fill="#9aa5b1"/>
</g><text x="488" y="340" text-anchor="middle" font-family="JetBrainsMono NF, JetBrains Mono, monospace" font-size="22" fill="#e6edf3">F · layers</text><text x="488" y="368" text-anchor="middle" font-family="JetBrainsMono NF, JetBrains Mono, monospace" font-size="14" fill="#8b95a5">three canopy layers, one trunk</text><g transform="translate(680,40)">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fc48f"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#0f1419"/>
  <!-- wide flat canopy -->
  <path d="M30 128 C30 92 70 66 128 66 C186 66 226 92 226 128 C226 140 214 146 200 146 L56 146 C42 146 30 140 30 128 Z" fill="url(#ag)"/>
  <!-- second canopy layer, lighter -->
  <path d="M66 112 C70 90 96 74 128 74 C160 74 186 90 190 112 Z" fill="#6ee7a7" opacity="0.55"/>
  <!-- trunk forking into the canopy -->
  <g stroke="#9aa5b1" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M128 236 V176"/>
    <path d="M128 176 C128 158 96 160 92 146"/>
    <path d="M128 176 C128 158 160 160 164 146"/>
  </g>
  <circle cx="128" cy="176" r="8" fill="#9aa5b1"/>
</g><text x="808" y="340" text-anchor="middle" font-family="JetBrainsMono NF, JetBrains Mono, monospace" font-size="22" fill="#e6edf3">G · acacia</text><text x="808" y="368" text-anchor="middle" font-family="JetBrainsMono NF, JetBrains Mono, monospace" font-size="14" fill="#8b95a5">wide canopy, forked trunk</text><g transform="translate(1000,40)">
  <rect width="256" height="256" rx="56" fill="#0f1419"/>
  <!-- a "c" drawn as one branch that sprouts -->
  <path d="M176 92 A62 62 0 1 0 176 164" fill="none" stroke="#e6edf3" stroke-width="22" stroke-linecap="round"/>
  <g stroke="#2fc48f" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M176 92 C190 74 206 70 222 72"/>
    <path d="M176 92 C184 76 184 60 180 46"/>
  </g>
  <circle cx="222" cy="72" r="10" fill="#6ee7a7"/>
  <circle cx="180" cy="46" r="10" fill="#6ee7a7"/>
  <circle cx="176" cy="164" r="10" fill="#9aa5b1"/>
</g><text x="1128" y="340" text-anchor="middle" font-family="JetBrainsMono NF, JetBrains Mono, monospace" font-size="22" fill="#e6edf3">H · monogram</text><text x="1128" y="368" text-anchor="middle" font-family="JetBrainsMono NF, JetBrains Mono, monospace" font-size="14" fill="#8b95a5">a c that branches</text></svg>