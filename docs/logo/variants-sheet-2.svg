  </defs>
  <rect width="256" height="256" rx="56" fill="#0f1419"/>
  <!-- leaf: pointed oval on the diagonal -->
  <path d="M56 200 C56 110 120 48 204 52 C208 136 146 200 56 200 Z" fill="url(#lg)"/>
